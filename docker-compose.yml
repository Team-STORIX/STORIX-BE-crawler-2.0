services:
  crawler:
    build: .
    image: storix-crawler:latest
    container_name: storix_crawler
    environment:
      - DOCKER_ENV=true
      - MYSQL_DATABASE_HOST=db
      - MYSQL_DATABASE_PORT=3306
      - MYSQL_DATABASE_USER=${MYSQL_DATABASE_USER:-root}
      - MYSQL_DATABASE_PASSWORD=${MYSQL_DATABASE_PASSWORD:-storix}
      - MYSQL_DATABASE_NAME=${MYSQL_DATABASE_NAME:-storix}
      - NAVER_ID=${NAVER_ID:-}
      - NAVER_PW=${NAVER_PW:-}
      - KAKAO_ID=${KAKAO_ID:-}
      - KAKAO_PW=${KAKAO_PW:-}
      - RIDIBOOKS_ID=${RIDIBOOKS_ID:-}
      - RIDIBOOKS_PW=${RIDIBOOKS_PW:-}
    volumes:
      - ./output:/app/output
      - ./sessions:/app/sessions
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - crawl
    command: ["python", "cli.py", "crawl", "--platform", "all", "--mode", "initial"]

  batch:
    build: .
    image: storix-crawler:latest
    container_name: storix_batch
    network_mode: host
    environment:
      - DOCKER_ENV=true
      - MYSQL_DATABASE_HOST=127.0.0.1
      - MYSQL_DATABASE_PORT=13306
      - MYSQL_DATABASE_USER=${MYSQL_DATABASE_USER:-root}
      - MYSQL_DATABASE_PASSWORD=${MYSQL_DATABASE_PASSWORD:-storix}
      - MYSQL_DATABASE_NAME=${MYSQL_DATABASE_NAME:-storix}
    volumes:
      - ./output:/app/output
    profiles:
      - batch
    command: ["python", "cli.py", "batch", "import"]

  scheduler:
    build: .
    image: storix-crawler:latest
    container_name: storix_scheduler
    environment:
      - DOCKER_ENV=true
      - MYSQL_DATABASE_HOST=db
      - MYSQL_DATABASE_PORT=3306
      - MYSQL_DATABASE_USER=${MYSQL_DATABASE_USER:-root}
      - MYSQL_DATABASE_PASSWORD=${MYSQL_DATABASE_PASSWORD:-storix}
      - MYSQL_DATABASE_NAME=${MYSQL_DATABASE_NAME:-storix}
      - NAVER_ID=${NAVER_ID:-}
      - NAVER_PW=${NAVER_PW:-}
      - KAKAO_ID=${KAKAO_ID:-}
      - KAKAO_PW=${KAKAO_PW:-}
      - RIDIBOOKS_ID=${RIDIBOOKS_ID:-}
      - RIDIBOOKS_PW=${RIDIBOOKS_PW:-}
    volumes:
      - ./output:/app/output
      - ./sessions:/app/sessions
    shm_size: '2gb'
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - scheduler
    command: ["python", "-m", "scheduler.runner"]

  db:
    image: mysql:8.0
    container_name: storix_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_DATABASE_PASSWORD:-storix}
      - MYSQL_DATABASE=${MYSQL_DATABASE_NAME:-storix}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
