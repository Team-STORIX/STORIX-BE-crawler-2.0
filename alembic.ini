# staging DB 구조 마이그레이션 (#52). 모델: review/models.py, 리비전: review/migrations/versions
# 접속 정보는 review/env.py · config.py 를 따른다 (STORIX_ENV → storix_staging_{env}). 여기 주소를 적지 않는다
#
#   alembic revision --autogenerate -m "설명"    모델 변경 → 리비전 생성 (검토 후 커밋)
#   alembic upgrade head                         적용 (stage 명령 · 검수 서버 시작 때 자동)
#   STORIX_ENV=prod alembic current              prod staging DB 의 현재 리비전

[alembic]
script_location = %(here)s/review/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
