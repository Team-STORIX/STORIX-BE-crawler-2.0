# 서버(EC2) 야간 실행용 (#77). deploy/nightly.sh 가 부른다.
# 비밀값은 nightly.sh 가 Parameter Store 에서 받아 /run/storix-crawler.env 에 둔다 (staging RDS · BE · 노션 · 슬랙).
# 로컬에서는 docker 대신 python cli.py ... 로 직접 실행한다 (로그인 창이 필요해서).
services:
  nightly:
    build: .
    image: storix-crawler:latest
    environment:
      - DOCKER_ENV=true
      - STORIX_ENV=prod
    env_file:
      - path: /run/storix-crawler.env
        required: false
    volumes:
      - ./output:/app/output
      - ./sessions:/app/sessions
    shm_size: '2gb'
    command: ["python", "cli.py", "requests", "--env", "prod"]

  # 로그인 쿠키를 받는 API (선택). 서버에는 S3 로 넣는 게 기본이다 (deploy/push_sessions.sh)
  session-api:
    build: .
    image: storix-crawler:latest
    container_name: storix_session_api
    restart: unless-stopped
    environment:
      - DOCKER_ENV=true
      - SESSION_API_TOKEN=${SESSION_API_TOKEN:-}
    volumes:
      - ./sessions:/app/sessions
    ports:
      - "8100:8100"
    profiles:
      - api
    command: ["uvicorn", "api.session_api:app", "--host", "0.0.0.0", "--port", "8100"]
