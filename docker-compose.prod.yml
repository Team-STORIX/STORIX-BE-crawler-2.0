# 서버(EC2) 배포용 compose — CD 워크플로우가 사용한다.
#
# 전제:
#   - /home/ubuntu/storix-crawler/ 에 이 파일과 .env 가 있다
#   - .env 에 MYSQL_*, 계정, SESSION_API_TOKEN 이 들어 있다
#   - IMAGE_TAG, ECR_REGISTRY 는 CD가 export 해서 주입한다
#
# 상시 서비스는 scheduler(크롤링 자동화)와 session-api(세션 등록) 둘뿐이고,
# 일회성 크롤링/적재는 기존처럼 docker compose run 으로 실행한다.

services:
  scheduler:
    image: ${ECR_REGISTRY}/storix-crawler:${IMAGE_TAG:-dev-latest}
    container_name: storix_scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      - DOCKER_ENV=true
    volumes:
      - ./output:/app/output
      - ./sessions:/app/sessions
    shm_size: '2gb'
    # 크롬이 폭주해도 인스턴스 전체가 죽지 않도록 상한 (필요 시 조정)
    mem_limit: 2g
    command: ["python", "-m", "scheduler.runner"]

  session-api:
    image: ${ECR_REGISTRY}/storix-crawler:${IMAGE_TAG:-dev-latest}
    container_name: storix_session_api
    restart: unless-stopped
    env_file: .env
    environment:
      - DOCKER_ENV=true
    volumes:
      - ./sessions:/app/sessions
    ports:
      - "8100:8100"
    mem_limit: 256m
    command: ["uvicorn", "api.session_api:app", "--host", "0.0.0.0", "--port", "8100"]
